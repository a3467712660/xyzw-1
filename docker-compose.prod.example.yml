services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      BACKEND_PORT: 8787
      DB_PATH: /var/lib/xyzw/data/xyzw.sqlite.bin
      BIN_STORAGE_PATH: /var/lib/xyzw/bin-storage
      BACKEND_ERROR_LOG_PATH: /var/lib/xyzw/logs/backend-errors.log
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - backend-state:/var/lib/xyzw

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8080:8080"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

volumes:
  backend-state:
