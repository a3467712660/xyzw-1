name: Security SCA

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  sca-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Run legacy guard
        run: npm run guard:legacy

      - name: Install root deps (locked)
        run: npm ci

      - name: Install backend deps (locked)
        run: npm --prefix backend ci

      - name: Run test suite
        run: npm test

      - name: Guard release build mode
        env:
          BUILD_MODE: production
          VITE_DEV_DEBUG_PROXY: "false"
        run: npm run security:build-mode

      - name: Build production frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_BUILD_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_ID: ${{ github.run_id }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_id }}
        run: npm run build

      - name: Verify production artifacts exclude legacy server
        run: |
          bash ./scripts/guard-legacy-server.sh
          tar -czf production-bundle.tar.gz \
            dist \
            backend/src \
            backend/package.json \
            backend/package-lock.json \
            backend/README.md \
            backend/.env.example \
            docker \
            package.json \
            package-lock.json \
            .dockerignore \
            scripts
          bash ./scripts/guard-legacy-server.sh production-bundle.tar.gz

      - name: Route matrix smoke check
        env:
          NODE_ENV: production
          JWT_SECRET: ci-jwt-secret-20260324
          AES_KEY: ci-aes-secret-20260324
          CSRF_SECRET: ci-csrf-secret-20260324
          INVITE_CODE_PEPPER: ci-invite-pepper-20260324
          ACTIVATION_CODE_PEPPER: ci-activation-pepper-20260324
          PASSWORD_RESET_CODE_PEPPER: ci-password-reset-pepper-20260324
          PUBLIC_APP_ORIGIN: https://ci.xyzw.invalid
          ADMIN_APP_ORIGIN: https://ci.xyzw.invalid
          CORS_ORIGINS: https://ci.xyzw.invalid
          ACCESS_COOKIE_SECURE: "true"
          REFRESH_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          DB_PATH: ./backend/data/ci-route-matrix.sqlite.bin
          BIN_STORAGE_PATH: ./backend/data/ci-route-matrix-bin
          BACKEND_PORT: 8877
          BUILD_GIT_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_id }}
        run: |
          mkdir -p backend/data
          node backend/src/index.js > /tmp/xyzw-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill $BACKEND_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8877/api/v1/health >/tmp/route-health.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8877/api/v1/version >/tmp/route-version.json
          TEMP_STATUS=$(curl -s -o /tmp/route-temp.out -w "%{http_code}" http://127.0.0.1:8877/api/v1/auth/temporary-invites)
          if [ "$TEMP_STATUS" != "404" ] && [ "$TEMP_STATUS" != "410" ]; then
            echo "temporary-invites expected 404/410 but got $TEMP_STATUS"
            cat /tmp/route-temp.out
            exit 1
          fi
          node -e 'const fs=require("fs"); const health=JSON.parse(fs.readFileSync("/tmp/route-health.json","utf8")); const version=JSON.parse(fs.readFileSync("/tmp/route-version.json","utf8")); if (!health.build?.gitSha) throw new Error("missing build gitSha on /api/v1/health"); if (!version.data?.gitSha) throw new Error("missing build gitSha on /api/v1/version");'

      - name: Live header smoke check for actual deployed nginx config
        run: |
          sed \
            -e "s|listen 3000;|listen 80;|g" \
            -e "s|listen \\[::\\]:3000;|listen [::]:80;|g" \
            -e "s|root /Users/qian/Downloads/xyzw-web-qian-acon-ui-refactor/dist;|root /app/web;|g" \
            -e "s|server_name xyzw.xq5007.fun;|server_name _;|g" \
            deploy/nginx/xyzw-xq5007.conf > /tmp/xyzw-nginx.conf
          docker run -d --rm \
            --name xyzw-csp-smoke \
            -p 8088:80 \
            -v "$PWD/dist:/app/web:ro" \
            -v "/tmp/xyzw-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          trap 'docker rm -f xyzw-csp-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsSI http://127.0.0.1:8088/ >/tmp/nginx-home.headers; then
              break
            fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8088/admin/activation-codes >/tmp/nginx-admin.headers
          grep -i '^content-security-policy:' /tmp/nginx-home.headers >/dev/null
          grep -i '^x-frame-options: DENY' /tmp/nginx-home.headers >/dev/null
          grep -i '^referrer-policy: strict-origin-when-cross-origin' /tmp/nginx-home.headers >/dev/null
          grep -i '^strict-transport-security: max-age=31536000; includeSubDomains' /tmp/nginx-home.headers >/dev/null
          grep -i '^content-security-policy:' /tmp/nginx-admin.headers | grep -F "connect-src 'self'" >/dev/null

      - name: Run SCA gate
        run: npm run security:sca
