name: Security SCA

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  sca-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root deps (locked)
        run: npm ci

      - name: Install backend deps (locked)
        run: npm --prefix backend ci

      - name: Guard legacy exclusion
        run: npm run guard:legacy

      - name: Enforce exact dependencies
        run: npm run security:no-floating-deps

      - name: Run security SCA gate
        run: npm run security:sca
