name: Build frontend image artifact

on:
  push:
    branches:
      - fix/daily-reward-claims
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: xyzw-1-frontend

jobs:
  build-frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t "$IMAGE_NAME:daily-reward-claims" .

      - name: Export image artifact
        run: |
          docker save "$IMAGE_NAME:daily-reward-claims" | gzip > xyzw-frontend-image.tar.gz
          ls -lh xyzw-frontend-image.tar.gz

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-frontend-image
          path: xyzw-frontend-image.tar.gz
          retention-days: 3
